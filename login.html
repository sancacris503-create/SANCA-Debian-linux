<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SALSAIVA</title>

    <link
      rel="shortcut icon"
      href="images/Logos/favicon-32x32-removebg-preview.png"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="./css/log.css" />
  </head>

  <body>
    <div class="container">
      <!-- LOGIN -->
      <div class="container-form">
        <form class="sign-in">
          <h2>Iniciar Sesión</h2>

          <div class="social-networks">
            <img src="./images/svg/cart.svg" alt="" />
            <img src="./images/svg/phone.svg" alt="" />
            <img src="./images/svg/world.svg" alt="" />
            <img src="./images/svg/bolsa.svg" alt="" />
          </div>

          <span>Use su correo y contraseña</span>

          <div class="container-input">
            <ion-icon name="at-outline"></ion-icon>
            <input type="text" placeholder="Email" />
          </div>

          <div class="container-input">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" placeholder="Contraseña" />
          </div>

          <a href="olvido.html">¿Olvidaste tu contraseña?</a>

          <button type="submit" class="button">INICIAR SESIÓN</button>
        </form>
      </div>

      <!-- REGISTRO -->
      <div class="container-form">
        <form class="sign-up">
          <h2>Registrarse</h2>

          <div class="social-networks">
            <img src="./images/svg/cart.svg" alt="" />
            <img src="./images/svg/phone.svg" alt="" />
            <img src="./images/svg/world.svg" alt="" />
            <img src="./images/svg/bolsa.svg" alt="" />
          </div>

          <span>Use su correo electrónico para registrarse</span>

          <div class="container-input">
            <ion-icon name="person-outline"></ion-icon>
            <input type="text" placeholder="Nombre" />
          </div>

          <div class="container-input">
            <ion-icon name="at-outline"></ion-icon>
            <input type="text" placeholder="Email" />
          </div>

          <div class="container-input">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" placeholder="Contraseña" />
          </div>

          <button type="submit" class="button">REGISTRARSE</button>
        </form>
      </div>

      <!-- PANEL AZUL -->
      <div class="container-welcome">
        <div class="welcome-sign-up welcome">
          <h3>¡Bienvenido!</h3>
          <p>Ingrese sus datos para empezar a ver el catálogo</p>
          <button class="button" id="btn-sign-up">Registrarse</button>
        </div>

        <div class="welcome-sign-in welcome">
          <h3>¡Hola!</h3>
          <p>Regístrate con tus datos para ver el catálogo</p>
          <button class="button" id="btn-sign-in">Iniciar Sesión</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/log.js"></script>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>

    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
